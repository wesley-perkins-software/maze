[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from   = "/mazes"
  to     = "/easy-mazes"
  status = 301

[[redirects]]
  from   = "/*"
  to     = "/404"
  status = 404

[context.production.environment]
  SITE_URL = "https://mazethis.com"

[context.deploy-preview.environment]
  SITE_URL = "https://deploy-preview--mazethis.netlify.app"

[[headers]]
  for = "/mazes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
