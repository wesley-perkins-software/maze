[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from   = "/mazes/small-*"
  to     = "/maze-library/small-mazes"
  status = 301

[[redirects]]
  from   = "/mazes/medium-*"
  to     = "/maze-library/medium-mazes"
  status = 301

[[redirects]]
  from   = "/mazes/large-*"
  to     = "/maze-library/large-mazes"
  status = 301

[[redirects]]
  from   = "/mazes"
  to     = "/maze-library"
  status = 301

[[redirects]]
  from   = "/mazes/*"
  to     = "/maze-library"
  status = 301

# Old top-level size routes → /maze-library/
[[redirects]]
  from   = "/small-mazes"
  to     = "/maze-library/small-mazes"
  status = 301

[[redirects]]
  from   = "/medium-mazes"
  to     = "/maze-library/medium-mazes"
  status = 301

[[redirects]]
  from   = "/large-mazes"
  to     = "/maze-library/large-mazes"
  status = 301

[[redirects]]
  from   = "/expert-mazes"
  to     = "/maze-library/expert-mazes"
  status = 301

[[redirects]]
  from   = "/monster-mazes"
  to     = "/maze-library/monster-mazes"
  status = 301

# /mazes-for-classroom and /mazes-for-seniors → /maze-guides equivalents
[[redirects]]
  from   = "/mazes-for-classroom"
  to     = "/maze-guides/mazes-for-classroom"
  status = 301

[[redirects]]
  from   = "/mazes-for-seniors"
  to     = "/maze-guides/mazes-for-seniors"
  status = 301

# /learn → /maze-guides
[[redirects]]
  from   = "/learn"
  to     = "/maze-guides"
  status = 301

[[redirects]]
  from   = "/learn/how-to-solve-a-maze"
  to     = "/maze-guides/how-to-solve-a-maze"
  status = 301

[[redirects]]
  from   = "/learn/how-mazes-work"
  to     = "/maze-guides/how-mazes-work"
  status = 301

[[redirects]]
  from   = "/learn/maze-difficulty"
  to     = "/maze-guides/maze-difficulty"
  status = 301

[[redirects]]
  from   = "/learn/maze-types"
  to     = "/maze-guides/maze-types"
  status = 301

[[redirects]]
  from   = "/learn/mazes-for-kids"
  to     = "/maze-guides/mazes-for-kids"
  status = 301

[[redirects]]
  from   = "/learn/mazes-for-classroom"
  to     = "/maze-guides/mazes-for-classroom"
  status = 301

[[redirects]]
  from   = "/learn/mazes-for-seniors"
  to     = "/maze-guides/mazes-for-seniors"
  status = 301

# /blog → /maze-guides (force=true overrides stale dist/blog/* output)
[[redirects]]
  from   = "/blog/how-to-solve-a-maze"
  to     = "/maze-guides/how-to-solve-a-maze"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/how-to-use-mazes-in-the-classroom"
  to     = "/maze-guides/mazes-for-classroom"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/mazes-for-seniors-cognitive-health"
  to     = "/maze-guides/mazes-for-seniors"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/printable-mazes-complete-guide"
  to     = "/printable-mazes"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/how-to-make-a-maze"
  to     = "/maze-generator"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/how-maze-generation-algorithms-work"
  to     = "/maze-guides/how-mazes-work"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/types-of-mazes-explained"
  to     = "/maze-guides/maze-types"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/maze-difficulty-explained"
  to     = "/maze-guides/maze-difficulty"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/maze-puzzles-for-all-ages"
  to     = "/maze-guides"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/benefits-of-mazes-for-kids"
  to     = "/maze-guides/mazes-for-kids"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/brain-training-with-mazes"
  to     = "/maze-guides"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/history-of-mazes-and-labyrinths"
  to     = "/maze-guides"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/mazes-vs-labyrinths"
  to     = "/maze-guides/maze-types"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog"
  to     = "/maze-guides"
  status = 301
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/404"
  status = 404

[context.production.environment]
  SITE_URL = "https://mazethis.com"

[context.deploy-preview.environment]
  SITE_URL = "https://deploy-preview--mazethis.netlify.app"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
