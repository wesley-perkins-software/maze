[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from   = "/mazes/small-*"
  to     = "/small-mazes"
  status = 301

[[redirects]]
  from   = "/mazes/medium-*"
  to     = "/medium-mazes"
  status = 301

[[redirects]]
  from   = "/mazes/large-*"
  to     = "/large-mazes"
  status = 301

[[redirects]]
  from   = "/mazes"
  to     = "/maze-library"
  status = 301

[[redirects]]
  from   = "/mazes/*"
  to     = "/maze-library"
  status = 301

# Blog → Learn redirects (force = true overrides the still-built /dist/blog/* pages)
# TODO: Once individual /learn/* guides are published, update the /learn fallbacks
#       (e.g. /blog/how-maze-generation-algorithms-work → /learn/how-mazes-work)
[[redirects]]
  from   = "/blog/how-to-solve-a-maze"
  to     = "/learn/how-to-solve-a-maze"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/how-to-use-mazes-in-the-classroom"
  to     = "/mazes-for-classroom"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/mazes-for-seniors-cognitive-health"
  to     = "/mazes-for-seniors"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/printable-mazes-complete-guide"
  to     = "/printable-mazes"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/how-to-make-a-maze"
  to     = "/maze-generator"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/how-maze-generation-algorithms-work"
  to     = "/learn/how-mazes-work"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/types-of-mazes-explained"
  to     = "/learn"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/maze-difficulty-explained"
  to     = "/learn/maze-difficulty"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/maze-puzzles-for-all-ages"
  to     = "/learn"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/benefits-of-mazes-for-kids"
  to     = "/learn"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/brain-training-with-mazes"
  to     = "/learn"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/history-of-mazes-and-labyrinths"
  to     = "/learn"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog/mazes-vs-labyrinths"
  to     = "/learn"
  status = 301
  force  = true

[[redirects]]
  from   = "/blog"
  to     = "/learn"
  status = 301
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/404"
  status = 404

[context.production.environment]
  SITE_URL = "https://mazethis.com"

[context.deploy-preview.environment]
  SITE_URL = "https://deploy-preview--mazethis.netlify.app"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
